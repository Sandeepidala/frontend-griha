<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Griha — design your home in 2D and 3D: layouts from your brief, design checks, cost estimates and construction drawings, built for India." />
    <!-- Link previews (WhatsApp, iMessage, Slack) when a page, such as a shared design, is pasted. -->
    <meta property="og:site_name" content="Griha" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="A home design on Griha" />
    <meta property="og:description" content="See the plan, the house in 3D, a video of it being built and what it costs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Griha</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('griha-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
