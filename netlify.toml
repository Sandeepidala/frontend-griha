[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Leave VITE_API_BASE_URL unset for demo mode (in-browser backend with example data). Set it in
  # Site configuration → Environment variables, e.g. https://<your-api>/api/v1, once the backend is deployed.

# The app routes in the browser, so every path serves index.html (e.g. a refresh on /projects/…).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
